<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#192348" />
      <stop offset="70%" stop-color="#0c1020" />
      <stop offset="100%" stop-color="#060810" />
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#ff2a85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Outer rhythm ring (maimai touch ring) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ring)" stroke-width="20" filter="url(#glow)" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-dasharray="12 8" />

  <!-- 8 Touch sensor indicator notches -->
  <circle cx="256" cy="76" r="12" fill="#00e5ff" />
  <circle cx="383" cy="129" r="12" fill="#38bdf8" />
  <circle cx="436" cy="256" r="12" fill="#818cf8" />
  <circle cx="383" cy="383" r="12" fill="#c084fc" />
  <circle cx="256" cy="436" r="12" fill="#ff2a85" />
  <circle cx="129" cy="383" r="12" fill="#f43f5e" />
  <circle cx="76" cy="256" r="12" fill="#00e5ff" />
  <circle cx="129" cy="129" r="12" fill="#38bdf8" />

  <!-- Center DX star logo -->
  <g transform="translate(256, 256)">
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="85" fill="#11162a" stroke="rgba(0, 229, 255, 0.4)" stroke-width="6" />
    <!-- Export Arrow Icon -->
    <path d="M-30,-20 L0,-50 L30,-20 M0,-45 L0,20" fill="none" stroke="#00e5ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <!-- DX text banner -->
    <rect x="-48" y="26" width="96" height="28" rx="6" fill="#ff2a85" />
    <text x="0" y="47" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">ASTRO</text>
  </g>
</svg>
